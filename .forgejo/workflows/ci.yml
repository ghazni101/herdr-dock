name: ci

# Delivery CI for this fork runs on Forgejo Actions. The GitHub repository is a
# mirror and runs none of this fork's CI, so this workflow replaces the previous
# GitHub Actions workflow of the same name on the long-lived `dock` branch, where
# custom work starts and lands. `master` stays identical to upstream
# herdrdev/herdr and keeps upstream's own workflows.
#
# Ported jobs: the conventional-commits check and the Linux `check` job. The
# Windows `windows-conpty-package` job and the Windows matrix entries cannot run
# on the Linux runner and are not ported.
#
# Runs on the self-hosted Forgejo runner in host mode (label `ubuntu-24.04`),
# which caps itself at 6 Cargo jobs so Forgejo and the other services keep
# running alongside CI. Each job checks out with its own token. There is no
# cache service: the runner keeps Rust, Cargo, Zig and Bun state under
# ~/.cache/herdr-ci between runs, and dependency steps only install what the
# pinned version needs.

on:
  pull_request:
    branches: [dock]
    types: [opened, synchronize, reopened]
  push:
    branches: [dock]

env:
  RUST_TOOLCHAIN_VERSION: "1.96.1"
  ZIG_VERSION: "0.16.0"
  BUN_VERSION: "1.3.14"
  # Keep file/line backtraces without generating type and variable debug information.
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "6"
  GIT_TERMINAL_PROMPT: "0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the merge request and always reports a check, so a merge request
  # never has an empty check list, including a docs-only one where `check` is
  # skipped.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: checkout
        run: |
          auth_header="AUTHORIZATION: basic $(printf '%s' "x:${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          repo_url="${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="$auth_header" clone --quiet "$repo_url" .
          git checkout --quiet "$GITHUB_SHA" 2>/dev/null || {
            git -c http.extraHeader="$auth_header" fetch --quiet origin "$GITHUB_REF"
            git checkout --quiet FETCH_HEAD
          }
      - name: classify
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            auth_header="AUTHORIZATION: basic $(printf '%s' "x:${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            git -c http.extraHeader="$auth_header" fetch --quiet origin "$BASE_REF"
          fi
          # --quiet exits 1 on a difference and >1 on an error; both take the
          # else branch, so a diff failure cannot mark a merge request docs-only.
          if git diff --quiet "$BASE_SHA"...HEAD -- . ':(exclude)**.md' ':(exclude)docs/**'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "docs-only merge request: check is skipped"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  conventional-commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: checkout
        run: |
          auth_header="AUTHORIZATION: basic $(printf '%s' "x:${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          repo_url="${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="$auth_header" clone --quiet "$repo_url" .
          git checkout --quiet "$GITHUB_SHA" 2>/dev/null || {
            git -c http.extraHeader="$auth_header" fetch --quiet origin "$GITHUB_REF"
            git checkout --quiet FETCH_HEAD
          }

      - name: validate merge request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "$PR_TITLE" ]; then
            echo "merge request event carried no title to validate" >&2
            exit 1
          fi
          python3 scripts/conventional_commits.py "$PR_TITLE"

      - name: validate pushed commit subjects
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          case "$BEFORE" in
            ""|0000000000000000000000000000000000000000)
              # A pushed branch without a parent commit has one subject to check.
              python3 scripts/conventional_commits.py "$(git log -1 --format=%s "$AFTER")"
              ;;
            *)
              python3 scripts/conventional_commits.py --range "$BEFORE..$AFTER"
              ;;
          esac

  check:
    name: check
    needs: changes
    if: ${{ needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: checkout
        run: |
          auth_header="AUTHORIZATION: basic $(printf '%s' "x:${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          repo_url="${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="$auth_header" clone --quiet "$repo_url" .
          git checkout --quiet "$GITHUB_SHA" 2>/dev/null || {
            git -c http.extraHeader="$auth_header" fetch --quiet origin "$GITHUB_REF"
            git checkout --quiet FETCH_HEAD
          }

      # Uses the pinned Rust, Zig and Bun versions the runner already provides,
      # and installs only a missing dependency into the persistent runner cache.
      - name: provision CI toolchain
        run: |
          set -eu
          cache="${XDG_CACHE_HOME:-$HOME/.cache}/herdr-ci"
          run_cache="$cache/run-${GITHUB_RUN_ID}"
          mkdir -p "$run_cache"

          if command -v rustup >/dev/null 2>&1; then
            rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --profile minimal \
              --component rustfmt --component clippy --no-self-update
            toolchain_bin="$(dirname "$(rustup which --toolchain "$RUST_TOOLCHAIN_VERSION" rustc)")"
            export PATH="$toolchain_bin:$PATH"
            echo "$toolchain_bin" >> "$GITHUB_PATH"
          else
            rustc --version | grep -Fq "$RUST_TOOLCHAIN_VERSION" || {
              echo "Rust $RUST_TOOLCHAIN_VERSION is required: provide rustup or the pinned toolchain on the runner" >&2
              exit 1
            }
          fi

          just_root="$cache/just"
          (
            flock 9
            if [ ! -x "$just_root/bin/just" ]; then
              cargo install just --locked --root "$just_root" --target-dir "$run_cache/install-target"
            fi
          ) 9>"$cache/just.lock"
          echo "$just_root/bin" >> "$GITHUB_PATH"

          nextest_root="$cache/nextest"
          (
            flock 9
            if [ ! -x "$nextest_root/bin/cargo-nextest" ]; then
              cargo install cargo-nextest --locked --root "$nextest_root" --target-dir "$run_cache/install-target"
            fi
          ) 9>"$cache/nextest.lock"
          echo "$nextest_root/bin" >> "$GITHUB_PATH"

          zig_dir="$cache/zig-$ZIG_VERSION"
          (
            flock 9
            if [ ! -x "$zig_dir/zig" ]; then
              case "$(uname -m)" in
                x86_64) zig_arch=x86_64 ;;
                aarch64|arm64) zig_arch=aarch64 ;;
                *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
              esac
              tmp="$(mktemp -d)"
              curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-$zig_arch-linux-$ZIG_VERSION.tar.xz" -o "$tmp/zig.tar.xz"
              tar -xJf "$tmp/zig.tar.xz" -C "$tmp"
              mv "$tmp/zig-$zig_arch-linux-$ZIG_VERSION" "$zig_dir"
              rm -rf "$tmp"
            fi
          ) 9>"$cache/zig-$ZIG_VERSION.lock"
          [ "$("$zig_dir/zig" version)" = "$ZIG_VERSION" ]
          echo "$zig_dir" >> "$GITHUB_PATH"

          # Direct release zip + python zipfile: the bun.sh installer requires
          # system unzip, which this host-mode runner does not provide.
          # x86_64 uses the baseline build: the default linux-x64 binary requires
          # AVX2 and dies with SIGILL on this Forgejo runner VM's CPU. Cache
          # path includes the target so a prior AVX2 install is not reused.
          case "$(uname -m)" in
            x86_64) bun_target=linux-x64-baseline ;;
            aarch64|arm64) bun_target=linux-aarch64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          bun_dir="$cache/bun-$BUN_VERSION-$bun_target"
          (
            flock 9
            if [ ! -x "$bun_dir/bin/bun" ]; then
              tmp="$(mktemp -d)"
              curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-$bun_target.zip" \
                -o "$tmp/bun.zip"
              python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
                "$tmp/bun.zip" "$tmp"
              mkdir -p "$bun_dir/bin"
              mv "$tmp/bun-$bun_target/bun" "$bun_dir/bin/bun"
              chmod +x "$bun_dir/bin/bun"
              rm -rf "$tmp"
            fi
          ) 9>"$cache/bun-$BUN_VERSION-$bun_target.lock"
          [ "$("$bun_dir/bin/bun" --version)" = "$BUN_VERSION" ]
          echo "$bun_dir/bin" >> "$GITHUB_PATH"

          # Per-run build dirs avoid cancel-in-progress races on shared host caches.
          {
            echo "ZIG=$zig_dir/zig"
            echo "ZIG_GLOBAL_CACHE_DIR=$run_cache/zig-cache"
            echo "ZIG_LOCAL_CACHE_DIR=$run_cache/zig-cache"
            echo "CARGO_TARGET_DIR=$run_cache/target"
          } >> "$GITHUB_ENV"

      - name: verify toolchain
        run: |
          rustc --version
          [ "$(rustc --version | cut -d' ' -f2)" = "$RUST_TOOLCHAIN_VERSION" ]
          zig version
          bun --version
          just --version
          cargo nextest --version

      - name: run Linux lint
        run: CARGO_INCREMENTAL=1 just lint

      - name: run Linux tests
        run: CARGO_INCREMENTAL=1 just ci-tests 'all()'

      - name: check scalar libghostty with runtime safety
        env:
          LIBGHOSTTY_VT_SIMD: "false"
          LIBGHOSTTY_VT_OPTIMIZE: ReleaseSafe
        run: CARGO_INCREMENTAL=1 cargo nextest run --locked -E 'package(ghostty-vt) | test(ghostty)' --status-level fail --final-status-level fail --failure-output final --success-output never

      - name: cleanup run cache
        if: always()
        run: |
          set -eu
          cache="${XDG_CACHE_HOME:-$HOME/.cache}/herdr-ci"
          rm -rf "$cache/run-${GITHUB_RUN_ID}"
